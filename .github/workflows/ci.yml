name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Safe, isolated mock credentials for CI validation.
      # No real external services (Supabase, Paystack, Resend) are contacted.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.example.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-dummy-service-role-key
      PAYSTACK_SECRET_KEY: sk_test_ci_dummy_paystack_secret_key_12345
      RESEND_API_KEY: re_ci_dummy_resend_api_key
      RESEND_FROM_NAME: Instant Cakes Delivery
      RESEND_FROM_EMAIL: orders@speedcake.com
      ADMIN_ORDER_EMAIL: orders@speedcake.com
      STORE_NOTIFICATION_EMAIL: orders@speedcake.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Run production build
        run: npm run build
